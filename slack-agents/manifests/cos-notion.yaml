display_information:
  name: CoS Notion
  description: Specialist agent — executes Notion read/write ops when delegated by @cos
  background_color: "#000000"
features:
  bot_user:
    display_name: cos-notion
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
