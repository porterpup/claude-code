display_information:
  name: CoS Inbox
  description: Specialist agent — triages Gmail, drafts replies, extracts tasks to Notion
  background_color: "#4a2d5e"
features:
  bot_user:
    display_name: cos-inbox
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
